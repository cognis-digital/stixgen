apiVersion: apps/v1
kind: Deployment
metadata: { name: stixgen, labels: { app: stixgen } }
spec:
  replicas: 1
  selector: { matchLabels: { app: stixgen } }
  template:
    metadata: { labels: { app: stixgen } }
    spec:
      containers:
        - name: stixgen
          image: ghcr.io/cognis-digital/stixgen:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: stixgen }
spec:
  selector: { app: stixgen }
  ports: [{ port: 80, targetPort: 8000 }]
